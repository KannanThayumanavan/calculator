title: "Feature Request: Add modulo and exponentiation operator support to expression parser"
description: >
  Request to extend the expression parser to support new operators (e.g., modulo %, exponentiation **).
  This is not a regression; these expressions were never supported.
  The parser should be extended to handle these additional operator types
  as a new feature, gated behind a feature flag (CALC_EXTENDED_OPERATORS)
  to ensure backward compatibility and safe rollout.
components:
  - expression-parser
  - calculator-core
