  - SCRUM-24
acceptance_criteria:
  - "The expression parser supports the modulo operator (%)"
  - "The expression parser supports the exponentiation operator (**)"
  - "New operator support is gated behind the CALC_EXTENDED_OPERATORS feature flag"
  - "Existing behavior is preserved when the feature flag is disabled"
  - "Unit tests cover both enabled and disabled feature flag scenarios"
notes: >
  This ticket was originally filed as a bug report suggesting a regression,
  but investigation confirmed that modulo and exponentiation operators were
  never supported by the expression parser. This has been reclassified as
  an enhancement/feature request accordingly.